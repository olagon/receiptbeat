# Compose code names functions in PascalCase and takes many params. Keep detekt useful, not noisy.
naming:
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 30
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 120
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 25
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 6
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false
  WildcardImport:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
